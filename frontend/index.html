<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finance Analyzer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Finance Analyzer</h1>

        <div class="summary">

            <div class="card">
                <h3>Income</h3>
                <p id="income">₹0</p>
            </div>

            <div class="card">
                <h3>Expenses</h3>
                <p id="expenses">₹0</p>
            </div>

            <div class="card">
                <h3>Savings</h3>
                <p id="savings">₹0</p>
            </div>

        </div>


        <div class="form-container">

            <h2>Add Transaction</h2>

            <form id="transactionForm">

                <input
                    type="number"
                    id="amount"
                    placeholder="Amount"
                    required
                >

                <select id="type">
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                </select>

                <input
                    type="text"
                    id="category"
                    placeholder="Category"
                    required
                >

                <input
                    type="text"
                    id="description"
                    placeholder="Description"
                >

                <input
                    type="date"
                    id="date"
                    required
                >

                <button type="submit">
                    Add Transaction
                </button>

            </form>

        </div>


        <div class="transactions">

            <h2>Transactions</h2>

            <table>

                <thead>

                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="transactionList"></tbody>

            </table>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
